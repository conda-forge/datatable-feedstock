schema_version: 1

context:
  name: datatable
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/datatable-${{ version }}.tar.gz
  sha256: 8a9f6953ef6b02ede3d7c490f17d5c18c9b1bf2d58dd5451a8cac40ed887d775
  patches:
    # the vendored flatbuffers has an invalid span::operator= that GCC 15
    # rejects at template definition time
    - patches/0001-remove-invalid-span-assignment-operator.patch
    # _PySys_GetSizeOf() left the public C API in python 3.13
    - patches/0002-use-sys-getsizeof-on-python-3.13.patch
    # dt.Type patched tp_basicsize of a type() -- created class, which
    # collides with the managed __dict__ of python 3.11+ and segfaults
    # during garbage collection on 3.13
    - patches/0003-make-dt-type-a-static-extension-type.patch
    # np.NaN was removed and repr() of NaT changed in numpy 2
    - patches/0004-fix-tests-for-numpy-2.patch

build:
  number: 2
  skip: match(python, ">3.13") or win
  script: |
    ${{ PYTHON }} ci/ext.py build
    ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
  run:
    - python

tests:
  - python:
      imports:
        - datatable
      pip_check: false
  - files:
      recipe:
        - setup.cfg
      source:
        - src
        - tests
        - tests_random
        - LICENSE
    requirements:
      run:
        - pip
        - numpy
        - pandas
        - pyarrow
        - xlrd <=1.2.0
        - docutils >=0.15
        - pygments >=2.6
        - sphinx >=4.0,<5.0
        - sphinx_rtd_theme >=0.5
        - nbsphinx >=0.5
        - pytest >=3.1
        - pytest-cov
    script:
      - rm tests/test-docs.py
      # test_multiprocessing_threadpool hangs on macOS, where multiprocessing
      # defaults to the "spawn" start method and each child starts a thread
      # pool of its own
      - if: osx
        then: pytest tests -k 'not test_fread_from_cmd2 and not test_dt_version and not test_random_attack and not test_multiprocessing_threadpool'
        else: pytest tests -k 'not test_fread_from_cmd2 and not test_dt_version and not test_random_attack'

about:
  summary: Python library for fast multi-threaded data manipulation and munging.
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://github.com/h2oai/datatable

extra:
  recipe-maintainers:
    - xylar
